nav{display:flex;gap:24px;font-size:11px;letter-spacing:.14em;color:#8B8B93}

/* the one plot owning the field */
.pulse{position:absolute;left:56px;right:56px;top:110px;bottom:250px}
.pulse svg{width:100%;height:100%}
.cat{position:absolute;left:56px;top:76px;font-size:11px;letter-spacing:.2em;color:#8B8B93}
.cat b{color:#F2F2F0}
/* year codes as catalog entries */
.codes{position:absolute;left:56px;right:56px;bottom:196px;display:flex;justify-content:space-between;
 font-size:10.5px;color:#6E6E76}
.codes b{color:#E8B84B;font-weight:600}
/* decoded strip: hover translates blocks to text (static: one decoded) */
.strip{position:absolute;left:56px;right:56px;bottom:120px;display:flex;gap:4px}
.strip i{flex:1;height:14px;background:#232329}
.strip i.g{background:#3E7EA6}.strip i.a{background:#E8B84B}.strip i.r{background:#B03A2E}
.strip .dec{position:absolute;right:0;bottom:24px;font-size:11px;color:#E8B84B}
/* bottom facts as catalogue data lines */
.facts{position:absolute;left:56px;right:56px;bottom:0;height:96px;border-top:1px solid rgba(242,242,240,.16);
 display:grid;grid-template-columns:repeat(4,1fr)}
.facts div{padding:16px 20px;border-right:1px solid rgba(242,242,240,.1)}
.facts div:last-child{border-right:none}
.facts .k{font-size:10px;letter-spacing:.18em;color:#6E6E76}
.facts .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:28px;margin-top:6px;letter-spacing:-.02em}
.facts .v.am{color:#E8B84B}
